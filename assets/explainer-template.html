<!--
explain-diff template.
Normally scripts/render_diff.py reads this file and fills in the @@MARKER slots.
Even when filling it in by hand, don't touch the CSS / JS / font links — only replace the marker slots.

Markers:
  @@DOCTITLE  content of <title>
  @@BADGES    hero badges (several .badge elements)
  @@TITLE     content of h1 (with <br> if needed)
  @@LEDE      a 2-3 sentence summary
  @@EXPLAIN   body of the Explain tab: four <section id="background|intuition|code|quiz"> blocks
  @@FILES     the Review tab's aside file list (<a class="file" href="#f-…">)
  @@SIDESTAT  one-line stat at the bottom of the aside
  @@TBSTAT    stat on the left of the Review toolbar
  @@DIFF      body of the Review tab: several <details class="rv-file"> blocks
  @@COMMENTS  comment data: <div class="rv-wrap" data-for="c1"><article class="rv-card">
                <div class="rv-hd"><span class="rv-n">01</span><span class="rv-loc">
                  <span class="rv-lf">path</span><span class="rv-ll">L8–11</span></span></div>
                <p>…</p><div class="gh-diff">…<span class="gh-file rv-sg">Suggestion</span>…</div></article></div>
                (the card actually shown on screen is built by JS; this markup is only used as the data source)
  @@FOOTER    footer note

Design contract:
  - Achromatic palette. A single accent: black (light) / white (dark). Only three semantic colors: success / warning / danger.
  - Cards use a subtle ring and shadow (--shadow-card) instead of a border. 12px rounding.
  - Body copy is Inter + IBM Plex Sans KR, code is Geist Mono.
  - Diff added lines get a solid bar on the left, deleted lines get a diagonal-hatch bar on the left.
  - Both tabs use the same grid (200 | 720 | 260), so alignment doesn't shift when switching tabs.

Review tab markup contract:
  <details class="rv-file" id="f-<slug>" open data-path="…" data-status="modified">
    <summary class="rv-file-hd">
      <span class="rv-chev"></span><span class="rv-path">src/x.ts</span>
      <span class="rv-badge modified">modified</span>
      <span class="rv-stat"><span class="add">+5</span><span class="del">-2</span></span>
      <span class="rv-cnt">2 comments</span>
    </summary>
    <div class="rv-file-body">
      <div class="rv-elide"><button type="button">312 lines collapsed · Expand</button></div>
      <table class="gh-diff-tbl rv-tbl" hidden>…generated…</table>
      <table class="gh-diff-tbl rv-tbl">…regular file…</table>
    </div>
  </details>
  Every row that falls within a comment's range gets data-rv="c3" (space-separated if there are several). A file's overall comment goes on the summary's data-rv.
-->
<!DOCTYPE html>
<html lang="<!-- @@LANG -->" data-lang="<!-- @@LANG -->">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- @@DOCTITLE --></title>
<script>
(function () {
  try {
    var t = localStorage.getItem('explain-theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
<style>
  :root, html[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --bg-subtle: #f7f8fa;
    --stage: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f5f7;
    --code-bg: #f4f5f7;
    --border: #e6e8ec;
    --border-strong: #d4d7dd;
    --hairline: rgba(0,0,0,.08);
    --text: #1a1a1a;
    --text-2: #404040;
    --muted: #737373;
    --faint: #a1a1a1;
    --accent: #0b0d12;
    --accent-hover: #2a2f3a;
    --accent-soft: #f0f1f3;
    --on-accent: #ffffff;
    --success: #15a06a;
    --warning: #d98404;
    --danger: #dc2626;
    --shadow-card: 0 0 0 1px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.04);
    --shadow-elevated: 0 0 0 .5px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);
    --shadow-md: 0 3px 10px -4px rgba(13,18,28,.10);
    --syn-comment: #a1a1a1;
    --syn-keyword: #8250df;
    --syn-fn: #0550ae;
    --syn-string: #0a7d4b;
    --syn-var: #953800;
    --radius-sm: 8px;
    --radius: 12px;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --cols: 200px minmax(0, 1600px) 286px;
    --gap: 40px;
    --maxw: 2230px;
    --hd: 78px;   /* compact header height. JS measures and overrides this */
    --tb: 44px;   /* review toolbar height */
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a0a0a;
    --bg-subtle: #101010;
    --stage: #101010;
    --surface: #1a1a1a;
    --surface-2: #242424;
    --code-bg: #171717;
    --border: #303030;
    --border-strong: #424242;
    --hairline: rgba(255,255,255,.12);
    --text: #f5f5f5;
    --text-2: #d4d4d4;
    --muted: #a3a3a3;
    --faint: #737373;
    --accent: #f5f5f5;
    --accent-hover: #ffffff;
    --accent-soft: #242424;
    --on-accent: #0a0a0a;
    --success: #34d399;
    --warning: #f5b14c;
    --danger: #f87171;
    --shadow-card: 0 0 0 1px rgba(255,255,255,.14), 0 1px 4px rgba(0,0,0,.24);
    --shadow-elevated: 0 0 0 .5px rgba(255,255,255,.09), 0 1px 4px rgba(0,0,0,.24);
    --shadow-md: 0 3px 10px -4px rgba(0,0,0,.32);
    --syn-comment: #737373;
    --syn-keyword: #d2a8ff;
    --syn-fn: #79c0ff;
    --syn-string: #7ee2b8;
    --syn-var: #ffa657;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  html.theme-ready,
  html.theme-ready *,
  html.theme-ready *::before,
  html.theme-ready *::after {
    transition: background-color .32s var(--ease), color .32s var(--ease), border-color .32s var(--ease), box-shadow .32s var(--ease);
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    font-weight: 425;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: #b3d4fc; color: #1d1d1f; }
  html[data-theme="dark"] ::selection { background: #3d4f6f; color: #f5f5f5; }
  a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--text); }
  code, .mono {
    font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .86em;
  }
  code {
    background: var(--code-bg);
    padding: .12em .4em;
    border-radius: 5px;
    color: var(--text);
    font-weight: 450;
  }
  button { font: inherit; }
  [hidden] { display: none !important; }

  /* ---------- hero (sticky, shrinks with --p) ---------- */
  .hero-slot { position: relative; }
  .hero {
    --p: 0;
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    transition: none;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: color-mix(in srgb, var(--bg) calc(var(--p) * 80%), transparent);
    -webkit-backdrop-filter: blur(calc(var(--p) * 14px)) saturate(1.4);
            backdrop-filter: blur(calc(var(--p) * 14px)) saturate(1.4);
    border-bottom: .5px solid color-mix(in srgb, var(--border) calc(var(--p) * 100%), transparent);
  }
  .hero-in {
    position: relative;
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--gap);
    max-width: var(--maxw);
    margin: 0 auto;
    padding: calc(44px - 30px * var(--p)) 32px calc(24px - 12px * var(--p));
    align-items: start;
  }
  .hero-txt { grid-column: 2; min-width: 0; }
  .hero-top {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: calc(18px - 10px * var(--p));
  }
  .hero-tools { flex: none; display: flex; gap: 8px; }
  .badge-row {
    display: flex; flex-wrap: nowrap; gap: 6px; flex: 1; min-width: 0;
    transform: scale(calc(1 - .1 * var(--p)));
    transform-origin: left center;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 500; color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 11px; border-radius: 999px;
    line-height: 1.4; white-space: nowrap; flex: none;
  }
  .badge[hidden], .badge-more[hidden] { display: none; }
  .badge-row > .badge { max-width: min(280px, 55%); overflow: hidden; text-overflow: ellipsis; display: block; }
  .badge svg, .badge-detail svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
  .badge-add { color: var(--success); }
  .badge-del { color: var(--danger); }
  .badge-files { color: var(--text); }
  .badge-more { position: relative; flex: none; }
  .badge-more summary { cursor: pointer; list-style: none; }
  .badge-more summary::-webkit-details-marker { display: none; }
  .badge-more summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .badge-popover { display: none; position: absolute; z-index: 60; top: 100%; right: 0; padding: 12px; width: min(320px, calc(100vw - 40px)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-card); white-space: normal; }
  @supports (backdrop-filter: blur(14px)) or (-webkit-backdrop-filter: blur(14px)) {
    .badge-popover { background: color-mix(in srgb, var(--bg) 80%, transparent); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); }
  }
  .badge-more[open] .badge-popover, .badge-more:focus-within .badge-popover { display: block; }
  @media (hover: hover) { .badge-more:hover .badge-popover { display: block; } }
  .badge-detail { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 10px; padding: 5px 0; font-size: 12px; color: var(--muted); }
  .badge-detail strong { color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
  .badge .mono { font-size: 12px; color: var(--text-2); }
  .badge-row > .badge:first-child { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
    animation: pulse 2.4s var(--ease) infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--success) 45%, transparent); }
    70% { box-shadow: 0 0 0 5px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  h1 {
    font-family: Inter, "IBM Plex Sans KR", sans-serif;
    font-size: calc(34px - 17px * var(--p));
    font-weight: 600; letter-spacing: -.03em;
    line-height: 1.2; margin: 0 0 calc(14px * (1 - var(--p))); color: var(--text);
  }
  .hero.is-compact h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero.is-compact h1 br { display: none; }
  .lede {
    color: var(--muted); font-size: 16.5px; margin: 0; max-width: 60ch; line-height: 1.65;
    opacity: calc(1 - var(--p) * 1.6);
    max-height: calc(var(--lede-h, 90px) * (1 - var(--p)));
    overflow: hidden;
  }

  .theme-toggle {
    width: 28px; height: 28px;
    border-radius: 8px; border: 0;
    background: var(--surface); color: var(--text);
    cursor: pointer; display: grid; place-items: center;
    box-shadow: var(--shadow-elevated); padding: 0;
    position: relative;
  }
  .theme-toggle:hover { background: var(--bg-subtle); }
  .theme-toggle:active { transform: scale(.97); }
  .theme-toggle svg { width: 15px; height: 15px; position: absolute; transition: opacity .28s var(--ease), transform .28s var(--ease); }
  .theme-toggle .icon-sun { opacity: 0; transform: rotate(-45deg) scale(.8); }
  .theme-toggle .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
  html[data-theme="dark"] .theme-toggle .icon-sun { opacity: 1; transform: rotate(0) scale(1); }
  html[data-theme="dark"] .theme-toggle .icon-moon { opacity: 0; transform: rotate(45deg) scale(.8); }

  /* ---------- shell grid ---------- */
  .shell {
    display: grid;
    grid-template-columns: var(--cols);
    gap: var(--gap);
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 28px 32px 120px;
    align-items: start;
  }
  main { min-width: 0; }
  .pane { min-width: 0; }
  body[data-tab="explain"] [data-pane="review"] { display: none; }
  body[data-tab="review"] [data-pane="explain"] { display: none; }

  /* ---------- aside ---------- */
  .side {
    position: sticky;
    top: calc(var(--hd) + 16px);
    align-self: start;
    max-height: calc(100vh - var(--hd) - 32px);
    overflow: auto;
    scrollbar-width: thin;
    padding: 4px 4px 12px 0;
  }
  .tabs {
    display: inline-flex; gap: 2px;
    background: var(--surface-2);
    border-radius: 9px; padding: 3px;
    margin: 0 0 16px;
  }
  .tabs button {
    border: 0; background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 500; padding: 5px 12px;
    border-radius: 7px; cursor: pointer;
    transition: background-color .15s var(--ease), color .15s var(--ease), box-shadow .15s var(--ease);
  }
  .tabs button svg { display: none; }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-card); }
  .side-fold summary { display: none; }
  .side-fold summary::-webkit-details-marker { display: none; }
  .toc-kicker {
    font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); margin: 0 0 10px 10px;
  }
  nav.toc a, nav.files a {
    display: flex; align-items: center; gap: 10px;
    color: var(--muted); text-decoration: none;
    font-size: 13.5px; font-weight: 450;
    padding: 6px 10px; border-radius: 7px; margin-bottom: 2px;
    transition: background-color .15s var(--ease), color .15s var(--ease);
  }
  nav.toc a::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--border-strong); flex: none;
  }
  nav.toc a:hover, nav.files a:hover { color: var(--text); background: var(--bg-subtle); }
  nav.toc a.active, nav.files a.active { color: var(--text); background: var(--accent-soft); font-weight: 500; }
  nav.toc a.active::before { background: var(--accent); }
  nav.files a {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 11.5px; gap: 8px;
  }
  nav.files a { align-items: flex-start; }
  nav.files a .fname { min-width: 0; flex: 1; display: flex; flex-direction: column; line-height: 1.35; }
  nav.files a .fdir { font-size: 10px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav.files a .fbase { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav.files a.active .fbase { color: var(--text); }
  nav.files a .stat { flex: none; font-size: 10.5px; display: inline-flex; gap: 4px; }
  .stat .add, .add { color: var(--success); }
  .stat .del, .del { color: var(--danger); }
  .side-hr { border: 0; border-top: .5px solid var(--border); margin: 14px 10px 10px; }
  .side-stat {
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 11px; color: var(--faint); padding: 0 10px; line-height: 1.6;
  }
  .side-stat b { color: var(--muted); font-weight: 500; }

  /* ---------- explain pane ---------- */
  section { margin-top: 20px; scroll-margin-top: calc(var(--hd) + 20px); }
  section + section { margin-top: 56px; padding-top: 44px; border-top: .5px solid var(--border); }
  h2 {
    font-family: Inter, "IBM Plex Sans KR", sans-serif;
    font-size: 23px; font-weight: 600; letter-spacing: -.02em;
    margin: 0 0 14px; color: var(--text);
  }
  h3 { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; color: var(--text); margin: 36px 0 10px; }
  p { color: var(--text-2); margin: 0 0 14px; }
  p.lead-in { color: var(--text); font-size: 17px; line-height: 1.6; }
  ul, ol { color: var(--text-2); margin: 0 0 16px; padding-left: 22px; }
  li { margin: 6px 0; }
  li::marker { color: var(--faint); }
  strong { color: var(--text); font-weight: 600; }

  /* Callout: a light tint panel with no bar/shadow, plus an icon and a label */
  .callout {
    --co: var(--text-2);
    display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 12px; row-gap: 4px;
    align-items: start;
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 14px 18px 15px 16px; margin: 22px 0;
  }
  .callout::before {
    content: ""; grid-row: 1 / span 2; width: 16px; height: 16px; margin-top: 2px;
    background: var(--co);
    -webkit-mask: var(--co-icon) center / contain no-repeat;
            mask: var(--co-icon) center / contain no-repeat;
    --co-icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M12 16v-4M12 8h.01'/></svg>");
  }
  .callout .k {
    grid-column: 2; font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
    color: var(--co); line-height: 1.4; margin: 1px 0 2px;
  }
  .callout p { grid-column: 2; font-size: 14.5px; line-height: 1.65; color: var(--text-2); margin: 0 0 8px; }
  .callout p:last-child { margin-bottom: 0; }
  .callout code { background: color-mix(in srgb, var(--text) 8%, transparent); }
  .callout.warn {
    --co: var(--warning);
    background: color-mix(in srgb, var(--warning) 9%, var(--bg));
  }
  .callout.warn::before {
    --co-icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z'/><path d='M12 9v4M12 17h.01'/></svg>");
  }
  .callout.warn p { color: var(--text); }
  /* One-line takeaway: the sentence to remember. Enlarge the text like a quote, keep the label light */
  .callout.ok {
    --co: var(--success);
    background: color-mix(in srgb, var(--success) 8%, var(--bg));
  }
  .callout.ok::before {
    --co-icon: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 6 9 17l-5-5'/></svg>");
  }
  .callout.ok p { font-size: 16.5px; line-height: 1.55; color: var(--text); font-weight: 500; letter-spacing: -.01em; }

  /* ---------- diff (shared by snippets and review) ---------- */
  .gh-diff {
    margin: 12px 0 22px; border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden;
  }
  .gh-diff-hd {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px 10px 16px; border-bottom: .5px solid var(--border);
    font-family: "Geist Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1;
  }
  .gh-file, .rv-path {
    display: inline-flex; align-items: center; gap: 7px;
    color: var(--text); font-weight: 450; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .gh-file::before, .rv-path::before {
    content: ""; flex: none; width: 14px; height: 14px; background: var(--faint);
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/></svg>") center / contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/></svg>") center / contain no-repeat;
  }
  .gh-stat, .rv-stat {
    margin-left: auto; display: inline-flex; gap: 8px;
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 12px; font-weight: 500; color: var(--success); font-variant-numeric: tabular-nums;
  }
  /* Per-code-block line-wrap toggle in the Explain tab — an icon just left of the stats (gh-stat). This is
     per-block state (data-wrap on .gh-diff), so it's independent of the review tab's global body[data-wrap]. */
  .gh-diff-hd .snip-wrap {
    flex: none; margin-left: auto; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px;
    background: transparent; color: var(--muted); cursor: pointer;

  .cm { color: var(--syn-comment); font-style: italic; }

  .rv-native-pane { width: 50%; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; }

  .rv-native-pane .rv-tbl tr.del .ln {
    background: repeating-linear-gradient(45deg, var(--danger) 0, var(--danger) 1.5px, transparent 1.5px, transparent 3px) left top / 3px 100% no-repeat,

  }

    background-image: repeating-linear-gradient(45deg, var(--danger) 0, var(--danger) 1.5px, transparent 1.5px, transparent 3px), linear-gradient(var(--rv-active-tint), var(--rv-active-tint)), linear-gradient(var(--surface), var(--surface));
    background-position: left top, 0 0, 0 0; background-size: 3px 100%, 100% 100%, 100% 100%; background-repeat: no-repeat;
    box-shadow: none;
  }

  #toggleSplit:disabled { opacity: .35; cursor: not-allowed; }
  #toggleSplit .ic-split, #toggleSplit.on .ic-single { display: none; }
  #toggleSplit.on .ic-split { display: block; }
  .rv-file {
    border-radius: var(--radius); overflow: clip;
    margin: 0 0 14px; scroll-margin-top: calc(var(--hd) + var(--tb) + 24px);
  }

    list-style: none; cursor: pointer; user-select: none;

      radial-gradient(circle at 100% 100%, transparent var(--radius), var(--bg) var(--radius)) left 2px bottom / var(--radius) var(--radius) no-repeat,

  .rv-chev {

    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='9 18 15 12 9 6'/></svg>") center / contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='9 18 15 12 9 6'/></svg>") center / contain no-repeat;
    background: currentColor;

  }

  .rv-badge {
    flex: none; font-family: Inter, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
    padding: 2px 7px; border-radius: 999px; line-height: 1.5;
    background: var(--surface-2); color: var(--muted);
  }
  .rv-badge.added { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); }

  .rv-tbl td.code { padding-left: 10px; }
  .rv-tbl tr.hunk td {

  }

  .rv-tbl tr.elide td { padding: 0; }
  .rv-tbl tr.elide button {
    width: 100%; border: 0; background: var(--bg-subtle); color: var(--muted);
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 11.5px; padding: 8px; cursor: pointer;
  }
  .rv-tbl tr.elide button:hover { color: var(--text); background: var(--surface-2); }
  .rv-tbl tr.bin td { padding: 14px; color: var(--faint); font-size: 12px; text-align: center; }
  /* Active indicator: a line on the left, plus a state where a light blue is mixed into that row's existing
     background (transparent/green/red) and stays for as long as it's active (no gradient bleed). To make it
     look like a stronger blue briefly flashes on activation and then settles into this light state, the
     static rule and the flash animation meet at the same --rv-active-tint value — so the color carries
     through even after the animation ends. */
  .rv-tbl tr.rv-on td:first-child { box-shadow: inset 4px 0 0 #4d8dff; }

     would blow out the alpha). */

  @keyframes rv-line-flash {

  /* Copy button that appears when dragging to select code (shared by the Explain/Review tabs). Same
     visual language as the other floating icon buttons (.theme-toggle, .rv-pin) — surface background +

  .rv-copy-tip {

  /* comment column — a single card, fixed alongside the code */
  .rv-col { position: relative; min-width: 0; overflow: clip; overflow-clip-margin: 24px; padding-left: 30px; }
  .rv-wrap { display: none !important; }
  .rv-solo {
    position: fixed; z-index: 50; min-width: 0;

  body[data-tab="explain"] .rv-solo { display: none; }
  @media (max-width: 1199px) { .rv-solo { display: none; } }
  .rv-solo.is-idle .rv-card { opacity: .4; }
  .rv-solo .rv-card {
    min-height: 120px;
    overflow: hidden;
    box-shadow: var(--shadow-elevated), var(--shadow-md);
  }
  .rv-solo .rv-n { display: inline-block; background: transparent; color: var(--text); padding: 0; font-variant-numeric: tabular-nums; }
  .rv-solo .rv-k { flex: none; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .rv-solo .rv-card .rv-ll { background: var(--accent); color: var(--on-accent); }
  .rv-solo .rv-card .rv-hd { position: relative; z-index: 1; }
  .rv-stepper {

  .rv-solo .rv-nav {
    flex: none; width: 18px; height: 22px; padding: 0; border: 0; border-radius: 5px;

  }
  .rv-solo .rv-nav svg { width: 12px; height: 12px; }
  .rv-solo .rv-nav:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
  .rv-solo .rv-nav:disabled { opacity: .28; cursor: default; }
  .rv-solo .rv-pin {
    position: absolute; right: 0; top: -28px;
    width: 22px; height: 22px; padding: 0; border: 0; border-radius: 5px;
    background: transparent; color: var(--muted); cursor: pointer;
    display: grid; place-items: center;
  }
  .rv-solo .rv-pin svg { width: 14px; height: 14px; }
  .rv-solo .rv-pin:hover { color: var(--text); background: var(--surface-2); }
  body[data-expand="click"] .rv-solo .rv-pin { color: var(--text); }
  body[data-expand="click"] .rv-solo .rv-pin svg { fill: currentColor; stroke: currentColor; }
  @keyframes rv-flash {
    0% {
      box-shadow:
        0 0 18px 4px color-mix(in srgb, #4d8dff 70%, transparent),
        0 0 48px 14px color-mix(in srgb, #4d8dff 35%, transparent),
        var(--shadow-md);
    }
    100% { box-shadow: var(--shadow-elevated), var(--shadow-md); }
  }
  .rv-solo .rv-card.is-flash { animation: rv-flash .85s var(--ease); }
  /* Left rail: a number chip + a range line. Always stays pinned to its anchor independently of the card,
     so its presence stays visible even when an expanded card covers other cards */
  .rv-mark {
    position: absolute; left: 0; top: 0; width: 22px; padding: 4px 0 0; border: 0; background: none; cursor: pointer;
    font-family: "Geist Mono", ui-monospace, monospace; font-size: 10.5px; font-weight: 600; line-height: 20px; color: var(--muted);
    text-align: center; will-change: transform;

    transition: background-color .2s var(--ease), color .2s var(--ease);
  }
  .rv-mark::after {
    content: ""; position: absolute; left: 10px; top: 26px; width: 2px; height: var(--len, 0px); border-radius: 1px;
    background: var(--border-strong); transition: background-color .2s var(--ease);
  }
  .rv-mark:hover .n { color: var(--text); }

  .rv-col .rv-wrap .rv-card .rv-n { display: none; }

  /* Card: same visual language as gh-diff — a surface panel with a hairline ring, a mono header strip with
     a .5px divider. Header = file icon + path (muted, truncated) + line-range pill (right). Body has 14px

  .rv-card {

    border-bottom: .5px solid var(--border);

    background: var(--surface);

  }
  .rv-wrap.is-active .rv-card .rv-hd { position: sticky; top: 0; z-index: 1; }
  .rv-card .rv-n {
    flex: none; font-size: 10.5px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: 5px;
    color: var(--text); background: var(--accent-soft);

  .rv-card .rv-loc { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; color: var(--muted); }

    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 20px;
  }
  .rv-card .rv-lf::before {
    content: ""; position: absolute; left: 0; top: 50%; margin-top: -6.5px; width: 13px; height: 13px; background: var(--faint);
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/></svg>") center / contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><polyline points='14 2 14 8 20 8'/></svg>") center / contain no-repeat;
  }
  .rv-card .rv-ll {
    flex: none; margin-left: auto; padding: 0 7px; line-height: 20px; border-radius: 6px;
    background: var(--surface-2); color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums;
    transition: background-color .2s var(--ease), color .2s var(--ease);
  }
  /* Active: since it floats above other cards, give it elevation with a shadow instead of a ring. The range pill uses accent, like the rail's chip */
  .rv-wrap.is-active .rv-card { box-shadow: var(--shadow-elevated), var(--shadow-md); }
  .rv-wrap.is-active .rv-card .rv-ll { background: var(--accent); color: var(--on-accent); }
  .rv-card p { font-size: 13.5px; margin: 0 0 8px; padding: 0 14px; color: var(--text-2); }
  .rv-card p:last-child { margin-bottom: 0; }
  .rv-card ul { font-size: 13px; margin: 0 0 8px; padding: 0 14px 0 32px; }
  .rv-card p, .rv-card li { overflow-wrap: anywhere; }
  .rv-card code { font-size: .88em; }
  /* Suggestion block: a small gh-diff inside the card. The header uses a small-label tone like a diagram caption, plus a lightbulb icon */
  .rv-card .gh-diff { margin: 12px 14px 0; border-radius: 10px; box-shadow: var(--shadow-card); }
  .rv-card .gh-diff-hd { padding: 7px 12px; font-size: 11px; }
  .rv-card .gh-diff-hd .gh-file { font-weight: 600; letter-spacing: .06em; color: var(--faint); }
  .rv-card .gh-diff-hd .rv-sg::before {
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z'/></svg>");
            mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z'/></svg>");
  }

  /* Collapsed tag: a surface pill with a hairline ring, showing only the line range */
  .rv-card.is-collapsed { cursor: pointer; padding: 0; border-radius: 7px; box-shadow: var(--shadow-card); }

  .rv-card.is-collapsed .rv-lf { display: none; }
  .rv-card.is-collapsed .rv-ll { margin-left: 0; padding: 0; background: transparent; color: var(--muted); font-size: 11px; }
  .rv-card.is-collapsed:hover { box-shadow: 0 0 0 1px var(--border-strong), var(--shadow-card); }

  tr.rv-inline .rv-card::after, .rv-inline-file .rv-card::after { display: none; }

      var header = $('.rv-file-hd', file);
      if (header) header.classList.toggle('is-ending', file.open && file.getBoundingClientRect().bottom <= header.getBoundingClientRect().bottom + 1);
    });
  }
  // Update the sticky header and active navigation while scrolling.
  function onScroll() {
    updateHero();
    if (body.dataset.tab === 'explain') { pinSolo(); markActive(tocLinks, tocSections); }
    else { syncEndingObservers(); markActive(fileLinks, fileEls); updateComments(); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('wheel', function () { holdK = -1; }, { passive: true });
  var resizeT;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(function () { measureHero(); syncFolds(); layoutComments(); syncEndingObservers(); onScroll(); }, 80);
  });
  if (window.ResizeObserver) {
    new ResizeObserver(scheduleLayout).observe($('main'));
  }
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { measureHero(); scheduleLayout(); });
  }
  // Re-measure in case of a font swap or a late layout shift
  setTimeout(function () { measureHero(); scheduleLayout(); }, 600);
  setTimeout(function () { measureHero(); scheduleLayout(); }, 2000);

  /* ---------- quiz ---------- */
  var answered = {};
  var total = $$('.q').length;
  $$('.q').forEach(function (q) {
    $$('.opts button', q).forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (q.dataset.done) return;
        q.dataset.done = '1';
        var ok = btn.getAttribute('data-ok') === '1';
        answered[q.dataset.q] = ok;
        $$('.opts button', q).forEach(function (b) {
          b.disabled = true;
          if (b === btn) b.classList.add(ok ? 'ok' : 'bad');
          else if (b.getAttribute('data-ok') === '1') b.classList.add('ok');
          else b.classList.add('miss');
        });
        var fb = $('.fb', q);
        fb.textContent = (ok ? T.quizCorrect : T.quizIncorrect) + btn.getAttribute('data-fb');
        fb.classList.add('show', ok ? 'correct' : 'wrong');
        var keys = Object.keys(answered);
        if (keys.length === total) {
          var n = keys.filter(function (k) { return answered[k]; }).length;
          var box = $('#score');
          if (box) { box.classList.add('show'); box.textContent = T.quizScore(n); }
        }
      });
    });
  });

  var mobileDock = $('#mobileDock'), mobileReview = $('#mobileReview');
  var mobileFiles = $('#mobileFiles'), mobileDialog = $('#mobileFilesDialog');
  var tabs = $('.tabs'), toolbar = $('.rv-toolbar'), toolbarButtons = $('.tb-btns');
  var commentNav = $('.inline-nav'), collapseButton = $('#toggleAll'), wrapButton = $('#toggleWrap');
  var docked = false;
  // Fit the review pill to its controls as the comment count changes.
  function sizeMobileReview() {
    if (!docked) return;
    var width = collapseButton.offsetWidth + wrapButton.offsetWidth + commentNav.offsetWidth + 12;
    mobileReview.style.setProperty('--review-width', width + 'px');
  }
  if (window.ResizeObserver) new ResizeObserver(sizeMobileReview).observe(commentNav);
  var popupFiles = $('#files').cloneNode(true);
  popupFiles.removeAttribute('id');
  if (!popupFiles.querySelector('a')) {
    var emptyFiles = document.createElement('p');
    emptyFiles.textContent = T.noChangedFiles;
    popupFiles.appendChild(emptyFiles);
  }
  var popupToc = $('#toc').cloneNode(true);
  popupToc.removeAttribute('id');
  mobileDialog.append(popupToc, popupFiles);
  $$('a', mobileDialog).forEach(function (link) { link.addEventListener('click', function () { mobileDialog.close(); }); });
  bindSmoothNav($$('a', popupToc), false);
  bindSmoothNav($$('a', popupFiles), true);
  mobileFiles.addEventListener('click', function () {
    var review = body.dataset.tab === 'review';
    popupToc.hidden = review;
    popupFiles.hidden = !review;
    var source = review ? fileLinks : tocLinks;
    var popup = review ? popupFiles : popupToc;
    $$('a', popup).forEach(function (link, index) {
      link.classList.toggle('active', !!source[index] && source[index].classList.contains('active'));
    });
    $('#mobileFilesTitle').textContent = review ? T.changedFiles : T.contents;
    mobileDialog.showModal();
  });
  $('#mobileFilesClose').addEventListener('click', function () { mobileDialog.close(); });
  mobileDialog.addEventListener('click', function (event) { if (event.target === mobileDialog) mobileDialog.close(); });
  // Move the existing controls between the mobile dock and their desktop locations.
  function syncMobileDock() {
    if (mqMobile.matches && !docked) {
      mobileDock.insertBefore(tabs, mobileFiles);
      mobileReview.append(collapseButton, wrapButton, commentNav);
      docked = true;
      sizeMobileReview();
    } else if (!mqMobile.matches && docked) {
      side.insertBefore(tabs, side.firstChild);
      toolbar.insertBefore(commentNav, toolbarButtons);
      toolbarButtons.append(collapseButton, wrapButton);
      if (mobileDialog.open) mobileDialog.close();
      docked = false;
    }
    mobileReview.inert = !docked || body.dataset.tab !== 'review';
    mobileFiles.setAttribute('aria-label', body.dataset.tab === 'review' ? T.changedFiles : T.contents);
    tabBtns.forEach(function (button) {
      var selected = button.dataset.tab === body.dataset.tab;
      button.setAttribute('aria-selected', String(selected));
      button.tabIndex = selected ? 0 : -1;
    });
  }
  mqMobile.addEventListener('change', function () { syncMobileDock(); scheduleLayout(); });

  var splitButton = $('#toggleSplit'), splitWanted = true, splitPrepared = false, splitLastWidth = 0;
  // Build two native scrollable tables with matching rows for each file.
  function prepareSplitRows() {
    $$('.rv-file-body > .rv-tbl').forEach(function (source) {
      source.classList.add('rv-original');
      var view = document.createElement('div'), panes = [], bodies = [], pairs = [];
      view.className = 'rv-native';
      [0, 1].forEach(function (side) {
        var pane = document.createElement('div'), table = source.cloneNode(false);
        pane.className = 'rv-native-pane';
        pane.tabIndex = 0;
        pane.setAttribute('role', 'region');
        pane.setAttribute('aria-label', side === 0 ? T.scrollOld : T.scrollNew);
        table.classList.remove('rv-original');
        table.removeAttribute('hidden');
        table.innerHTML = '<colgroup><col class="c-ln"><col class="c-gut"><col></colgroup>';
        var tbody = document.createElement('tbody');
        table.appendChild(tbody); pane.appendChild(table); view.appendChild(pane);
        panes.push(pane); bodies.push(tbody);
      });
      // Duplicate context and insert blank rows so matching changes stay aligned.
      function appendPair(left, right) {
        var pair = [left, right].map(function (row, side) {
          var item;
          if (row) {
            item = row.cloneNode(true);
            var unused = item.querySelector(side === 0 ? '.ln.new' : '.ln.old');
            if (unused) unused.remove();
            var spanning = item.querySelector('[colspan]');
            if (spanning) spanning.colSpan = 3;
          } else {
            item = document.createElement('tr'); item.className = 'rv-blank';
            item.innerHTML = '<td colspan="3"></td>';
          }
          bodies[side].appendChild(item);
          return item;
        });
        pairs.push(pair);
      }
      var rows = $$('tbody > tr', source), i = 0;
      while (i < rows.length) {
        if (rows[i].classList.contains('del') || rows[i].classList.contains('add')) {
          var removed = [], added = [];
          while (i < rows.length && rows[i].classList.contains('del')) removed.push(rows[i++]);
          while (i < rows.length && rows[i].classList.contains('add')) added.push(rows[i++]);
          for (var n = 0; n < Math.max(removed.length, added.length); n++) appendPair(removed[n], added[n]);
        } else { appendPair(rows[i], rows[i]); i++; }
      }
      view._pairs = pairs;
      var mirrored = [null, null];
      panes.forEach(function (pane, side) {
        pane.addEventListener('scroll', function () {
          var value = pane.scrollLeft, otherSide = side === 0 ? 1 : 0, other = panes[otherSide];
          if (mirrored[side] === value) { mirrored[side] = null; return; }
          mirrored[side] = null;
          if (other.scrollLeft !== value) { mirrored[otherSide] = value; other.scrollLeft = value; }
        });
      });
      source.after(view);
    });
    rowIndex = null;
    splitPrepared = true;
  }
  // Match native table widths and row heights after layout or line-wrap changes.
  function fitSplitViews() {
    if (body.dataset.diffView !== 'split') return;
    $$('.rv-native').forEach(function (view) {
      if (!view.getClientRects().length) return;
      var panes = Array.from(view.children), tables = panes.map(function (pane) { return pane.firstElementChild; });
      tables.forEach(function (table) { table.style.minWidth = ''; });
      if (view._heightAdjusted) {
        view._pairs.forEach(function (pair) { pair[0].style.height = ''; pair[1].style.height = ''; });
        view._heightAdjusted = false;
      }
      if (body.dataset.wrap === 'off') {
        var width = Math.max(tables[0].offsetWidth, tables[1].offsetWidth);
        tables.forEach(function (table) { table.style.minWidth = width + 'px'; });
      } else {
        var heights = view._pairs.map(function (pair) {
          return Math.max(pair[0].getBoundingClientRect().height, pair[1].getBoundingClientRect().height);
        });
        view._pairs.forEach(function (pair, index) {
          pair[0].style.height = heights[index] + 'px'; pair[1].style.height = heights[index] + 'px';
        });
        view._heightAdjusted = true;
      }
    });
    scheduleLayout();
  }
  // Use side-by-side view only while the code area has enough room.
  function syncSplitView() {
    var mainWidth = Math.round($('main').getBoundingClientRect().width);
    var available = mainWidth >= 960 && !mqMobile.matches;
    var split = available && splitWanted && body.dataset.tab === 'review';
    if (split && !splitPrepared) prepareSplitRows();
    var changed = (body.dataset.diffView === 'split') !== split;
    body.dataset.diffView = split ? 'split' : 'unified';
    splitButton.disabled = !available;
    splitButton.classList.toggle('on', split);
    splitButton.setAttribute('aria-pressed', String(split));
    splitButton.setAttribute('aria-label', !available ? T.splitUnavailable : split ? T.unifiedView : T.splitView);
    splitButton.title = splitButton.getAttribute('aria-label');
    if (split && (changed || mainWidth !== splitLastWidth)) requestAnimationFrame(fitSplitViews);
    else if (changed) scheduleLayout();
    splitLastWidth = mainWidth;
  }
  splitButton.addEventListener('click', function () { splitWanted = !splitWanted; syncSplitView(); });
  if (window.ResizeObserver) new ResizeObserver(syncSplitView).observe($('main'));
  else window.addEventListener('resize', syncSplitView);

  // Fit each file's line-number column to its largest line number.
  function sizeLineNumbers() {
    $$('.rv-tbl').forEach(function (table) {
      var digits = 0;
      $$('.ln', table).forEach(function (line) { digits = Math.max(digits, line.textContent.trim().length); });
      table.style.setProperty('--line-width', (44 + Math.max(0, digits - 3) * 6) + 'px');
    });
  }

  /* ---------- init ---------- */
  sizeLineNumbers();
  syncMobileDock();
  syncSplitView();
  measureHero();
  syncFolds();
  if (files.length === 0 && $('#rvFiles')) {
    $('#rvFiles').innerHTML = '<div class="rv-empty">' + T.noChangedFiles + '</div>';
  }
  goHash(false);
  layoutComments();
  syncEndingObservers();
  onScroll();
})();
</script>
</body>
</html>
